name: Publish HABITAT
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  main_verification:
    name: Reuse verification for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          discovery_deadline=$((SECONDS + 15))
          wait_deadline=$((SECONDS + 360))
          while :; do
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" \
              -f branch=main -f event=push -f "head_sha=$GITHUB_SHA" -F per_page=1 \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .head_branch == \"main\" and .event == \"push\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\") | [.id, .status, (.conclusion // \"pending\")] | @tsv")
            IFS=$'\t' read -r id status conclusion <<< "$run"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                echo "Reusing verified commit from run $id."
                echo 'reused=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$conclusion" == failure || "$conclusion" == timed_out ]]; then
                echo "::error::Verification run $id failed for this commit on main."
                exit 1
              fi
              break
            fi
            if [[ -z "$id" && "$SECONDS" -ge "$discovery_deadline" ]]; then
              break
            fi
            if [[ "$SECONDS" -ge "$wait_deadline" ]]; then
              echo "::error::Verification run $id did not finish within the release budget."
              exit 1
            fi
            sleep 5
          done
          echo 'Verifying the tagged commit in this workflow.'
          echo 'reused=false' >> "$GITHUB_OUTPUT"
  verify:
    needs: main_verification
    if: needs.main_verification.outputs.reused == 'false'
    uses: ./.github/workflows/verify.yml
    with:
      skip_production_build: true
  package:
    name: Build and test release packages
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/Habitat.App/packages.lock.json
      - name: Validate tag and main ancestry
        id: source
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag differs from VERSION.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to main.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install EXE compiler
        shell: powershell
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build shared payload and test ZIP and EXE
        shell: powershell
        env:
          HABITAT_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.HABITAT_DRIVE_OAUTH_CLIENT_JSON }}
        run: |
          $clientJson = $env:HABITAT_DRIVE_OAUTH_CLIENT_JSON
          Remove-Item Env:HABITAT_DRIVE_OAUTH_CLIENT_JSON -ErrorAction SilentlyContinue
          if (-not $clientJson) { throw 'Google Drive desktop client is required for the official release.' }
          try {
            $client = ConvertFrom-Json -InputObject $clientJson -ErrorAction Stop
            if ($clientJson.Length -gt 65536 -or $client.installed.client_id -notmatch '^[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$' -or
                [string]::IsNullOrWhiteSpace($client.installed.client_secret)) { throw 'Invalid client.' }
          } catch { throw 'Configure a Google Desktop OAuth client for Drive release builds.' }
          $clientPath = Join-Path $env:RUNNER_TEMP ('habitat-drive-' + [guid]::NewGuid().ToString('N') + '.json')
          try {
            $configuration = @{ installed = @{
              client_id = $client.installed.client_id
              client_secret = $client.installed.client_secret
            }} | ConvertTo-Json -Compress
            [IO.File]::WriteAllText($clientPath, $configuration, [Text.UTF8Encoding]::new($false))
            ./scripts/build-release-assets.ps1 -DriveClientPath $clientPath
          } finally {
            Remove-Item -LiteralPath $clientPath -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: habitat-release-assets
          path: |
            artifacts/packages/HABITAT-${{ steps.source.outputs.version }}-win-x64.zip
            artifacts/packages/HABITAT-${{ steps.source.outputs.version }}-win-x64.zip.sha256
            artifacts/distribution/${{ steps.source.outputs.version }}/HABITAT-${{ steps.source.outputs.version }}-x64-setup.exe
            artifacts/distribution/${{ steps.source.outputs.version }}/HABITAT-${{ steps.source.outputs.version }}-x64-setup.exe.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: habitat-package-diagnostics
          path: |
            artifacts/verification/*/release-logs/*.log
            artifacts/verification/*/*.log
          if-no-files-found: ignore
          retention-days: 3
  publish:
    needs: [main_verification, verify, package]
    if: >-
      ${{ !cancelled() && needs.main_verification.result == 'success' && needs.package.result == 'success' &&
          (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.main_verification.outputs.reused == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: habitat-release-assets
          path: artifacts
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "artifacts/packages/HABITAT-$version-win-x64.zip"
          $installer = "artifacts/distribution/$version/HABITAT-$version-x64-setup.exe"
          foreach ($asset in $zip, $installer) {
            $expected = ((Get-Content -LiteralPath "$asset.sha256" -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -ne $expected) { throw "Artifact checksum does not match: $asset" }
          }
          $notes = "artifacts/release-notes.md"
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($version) + ' .*?(?=^## |\z)').Value
          if (-not $section) { throw 'Changelog section is missing.' }
          $section | Set-Content $notes -Encoding utf8
          $upload = [Diagnostics.Stopwatch]::StartNew()
          gh release create "v$version" $zip "$zip.sha256" $installer "$installer.sha256" --verify-tag --title "HABITAT $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          Write-Host ('Release upload completed in {0:N1}s.' -f $upload.Elapsed.TotalSeconds)
      - name: Verify delivery and retire local assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $summary = ./scripts/complete-release.ps1 -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY -Apply
          $summary | Write-Host
