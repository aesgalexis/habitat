<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>body{background:#121724;color:white;font:13px Segoe UI,sans-serif;width:300px;padding:14px}input,button{box-sizing:border-box;width:100%;margin:7px 0;padding:9px;background:#273247;color:white;border:1px solid #43506a;border-radius:7px}button{cursor:pointer}button:disabled,input:disabled{opacity:.5;cursor:default}p{color:#b8c1d9;line-height:1.5}a{color:#aeb7ff}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #b4bcff;outline-offset:2px}</style>
<h3>HABITAT Browser Bridge</h3>
<p>Connect Chrome to the HABITAT desktop app on this computer.</p>
<button id="settings" type="button">Connection and privacy</button>
<button id="automatic" type="button" disabled>Connect automatically</button>
<details><summary>Manual pairing</summary><p>Use the app code only if automatic connection fails.</p><label for="key">App code</label><input id="key" placeholder="Paste the code from HABITAT" autocomplete="off" disabled><button id="bind" type="button" disabled>Connect this tab</button></details>
<button id="unbind" type="button">Disconnect</button>
<p id="msg" role="status" aria-live="polite">Review the connection settings to enable HABITAT.</p>
<a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a>
<script src="popup.js"></script>
</html>
